<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tennis-Trainer</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><section class="card hero"><h1>Tennis-Trainerstunden</h1><p>Bitte zuerst den Verein auswählen.</p></section><section class="card" id="clubs">Lade Vereine …</section></main><script>async function go(){let r=await fetch('/api/clubs'),d=await r.json();document.getElementById('clubs').innerHTML=d.length?d.map(c=>`<a class="club-card" href="/club/${encodeURIComponent(c.slug)}"><b>${e(c.name)}</b><span>Abfrage öffnen →</span></a>`).join(''):'Keine aktiven Abfragen.'}function e(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}go()</script></body></html>
