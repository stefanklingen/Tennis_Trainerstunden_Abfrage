<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tennis-Trainer</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><section class="card hero"><h1>Tennis-Trainerstunden</h1><p>Bitte zuerst den Verein auswählen.</p></section><section class="card" id="clubs">Lade Vereine …</section><section class="card contact"><p>Fragen zur Abfrage? <a href="mailto:jugendwart@tc-laer.de">jugendwart@tc-laer.de</a></p></section></main><script>async function go(){let r=await fetch('/api/clubs'),d=await r.json();document.getElementById('clubs').innerHTML=d.length?d.map(c=>`<div class="club-card"><b>${e(c.name)}</b><div class="actions"><a class="button" href="/club/${encodeURIComponent(c.slug)}">Zur Abfrage</a><a class="button admin-button" href="/admin/${encodeURIComponent(c.slug)}">Zur Administration</a></div></div>`).join(''):'Keine aktiven Abfragen.'}function e(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}go()</script></body></html>
