<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terminabfrage</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><section class="card hero"><a class="back" href="/">← Verein auswählen</a><h1 id="title">Terminabfrage</h1><p>Wähle alle Wochentage/Uhrzeiten aus, an denen du Zeit hast.</p></section><section class="card"><label>Name</label><input id="name" placeholder="Vor- und Nachname" maxlength="80"><label class="check"><input id="none" type="checkbox"> Kein Bedarf an einer Trainerstunde</label><h2>Meine möglichen Zeiten</h2><div id="slots">Lade …</div><button id="send">Antwort speichern</button><div id="msg"></div></section></main><script>const slug=location.pathname.split('/').filter(Boolean)[1],days=['','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'],$=x=>document.getElementById(x);function e(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function load(){let r=await fetch('/api/club/'+slug),d=await r.json();if(!r.ok){$('slots').textContent=d.error;return}$('title').textContent=d.name;let last=0;$('slots').innerHTML=d.slots.map(s=>{let h=last!=s.weekday?`<div class="date">${days[s.weekday]}</div>`:'';last=s.weekday;return h+`<label class="slot"><input class="s" type="checkbox" value="${s.id}"><b>${s.time.slice(0,5)} Uhr</b><span>${e(s.label||'')}</span></label>`}).join('')||'Noch keine Zeiten.'}$('none').onchange=()=>document.querySelectorAll('.s').forEach(x=>{x.disabled=$('none').checked;if($('none').checked)x.checked=false});$('send').onclick=async()=>{let b={name:$('name').value.trim(),noNeed:$('none').checked,slotIds:[...document.querySelectorAll('.s:checked')].map(x=>+x.value)},r=await fetch('/api/club/'+slug+'/responses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json();$('msg').textContent=r.ok?'Vielen Dank! Deine Antwort wurde gespeichert.':d.error;$('msg').className=r.ok?'ok':'err';if(r.ok){$('name').value='';$('none').checked=false;document.querySelectorAll('.s').forEach(x=>{x.checked=false;x.disabled=false})}};load()</script></body></html>
