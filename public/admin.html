<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin – Tennis-Terminabfrage</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="wrap wide">
<section class="card"><h1>Auswertung</h1><div id="login"><input id="pw" type="password" placeholder="Admin-Passwort"><button id="loginBtn">Anmelden</button><p id="lm"></p></div>
<div id="app" hidden>
<h2>Termin hinzufügen</h2><div class="grid"><input id="date" type="date"><input id="time" type="time"><input id="label" placeholder="Bezeichnung (optional)"><button id="add">Hinzufügen</button></div>
<div id="appointments"></div><hr><div class="toolbar"><h2>Antworten</h2><button id="csv">CSV exportieren</button></div><div id="stats"></div><div class="table"><table id="tab"></table></div></div></section></main>
<script>
let pw="",data;
const $=x=>document.getElementById(x);
$("loginBtn").onclick=async()=>{pw=$("pw").value;let r=await fetch("/api/admin/results",{headers:{"x-admin-password":pw}});if(!r.ok){$("lm").textContent="Falsches Passwort";return}$("login").hidden=true;$("app").hidden=false;load()};
async function load(){let r=await fetch("/api/admin/results",{headers:{"x-admin-password":pw}});data=await r.json();render()}
function dt(x){return new Intl.DateTimeFormat("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"}).format(new Date(x+"T12:00:00"))}
function render(){let a=data.appointments,r=data.responses;
$("appointments").innerHTML=a.map(x=>`<p>${dt(x.date)} ${x.time.slice(0,5)} ${esc(x.label||"")} <button onclick="delA(${x.id})">Löschen</button></p>`).join("")||"<p>Keine Termine.</p>";
$("stats").innerHTML=`<b>${r.length}</b> Antworten · <b>${r.filter(x=>x.no_need).length}</b> ohne Bedarf<br>`+a.map(x=>`${dt(x.date)} ${x.time.slice(0,5)}: <b>${r.filter(y=>!y.no_need&&y.appointment_ids.includes(x.id)).length}</b>`).join(" · ");
$("tab").innerHTML="<tr><th>Name</th><th>Status</th>"+a.map(x=>`<th>${dt(x.date)}<br>${x.time.slice(0,5)}</th>`).join("")+"<th></th></tr>"+r.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.no_need?"Kein Bedarf":"Bedarf"}</td>`+a.map(y=>`<td>${x.no_need?"–":x.appointment_ids.includes(y.id)?"✓":""}</td>`).join("")+`<td><button onclick="delR(${x.id})">Löschen</button></td></tr>`).join("")}
$("add").onclick=async()=>{await fetch("/api/admin/appointments",{method:"POST",headers:{"Content-Type":"application/json","x-admin-password":pw},body:JSON.stringify({date:$("date").value,time:$("time").value,label:$("label").value})});$("label").value="";load()};
async function delA(id){if(confirm("Termin löschen?")){await fetch("/api/admin/appointments/"+id,{method:"DELETE",headers:{"x-admin-password":pw}});load()}}
async function delR(id){if(confirm("Antwort löschen?")){await fetch("/api/admin/responses/"+id,{method:"DELETE",headers:{"x-admin-password":pw}});load()}}
$("csv").onclick=()=>{let a=data.appointments,rows=[["Name","Kein Bedarf",...a.map(x=>x.date+" "+x.time) ],...data.responses.map(r=>[r.name,r.no_need?"Ja":"Nein",...a.map(x=>!r.no_need&&r.appointment_ids.includes(x.id)?"Ja":"Nein")])];let csv=rows.map(x=>x.map(v=>`"${String(v).replaceAll('"','""')}"`).join(";")).join("\r\n"),b=new Blob(["\ufeff"+csv],{type:"text/csv"}),u=URL.createObjectURL(b),z=document.createElement("a");z.href=u;z.download="tennis-terminabfrage.csv";z.click();URL.revokeObjectURL(u)}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
</script></body></html>
