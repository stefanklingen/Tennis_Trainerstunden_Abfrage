<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zentraler Admin</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap wide"><section class="card"><div id="login"><h1>Zentraler Admin</h1><input id="pw" type="password" placeholder="Zentrales Admin-Passwort"><button onclick="login()">Anmelden</button><p id="msg"></p></div><div id="app" hidden><h1>Vereinsverwaltung</h1><div class="card"><h2>Verein anlegen</h2><div class="grid"><input id="name" placeholder="Vereinsname"><input id="slug" placeholder="Kurzname, z.B. tc-muenster"><input id="cpw" type="password" placeholder="Vereins-Admin-Passwort"><input id="spw" type="password" placeholder="Abfrage-Passwort"><button onclick="create()">Anlegen</button></div></div><div id="clubs"></div></div></section></main><script>const $=x=>document.getElementById(x);let pw='';function e(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function login(){pw=$('pw').value;let r=await fetch('/api/central/clubs',{headers:{'x-central-password':pw}});if(!r.ok){$('msg').textContent='Falsches Passwort';return}$('login').hidden=true;$('app').hidden=false;load()}async function load(){let r=await fetch('/api/central/clubs',{headers:{'x-central-password':pw}});render(await r.json())}function render(cs){$('clubs').innerHTML=cs.length?cs.map(c=>`<div class="club-row"><div><b>${e(c.name)}</b> /${e(c.slug)}<br>${c.active?'aktiv':'deaktiviert'}</div><div class="actions"><a class="button" href="/club/${e(c.slug)}" target="_blank">Abfrage</a><a class="button" href="/admin/${e(c.slug)}" target="_blank">Admin</a><button onclick="setpw(${c.id})">Admin-Passwort</button><button onclick="setspw(${c.id})">Abfrage-Passwort</button><button onclick="toggle(${c.id},${!c.active})">${c.active?'Deaktivieren':'Aktivieren'}</button><button class="danger" onclick="removeC(${c.id},'${e(c.name)}')">Komplett löschen</button></div></div>`).join(''):'Noch keine Vereine.'}async function create(){let b={name:$('name').value.trim(),slug:$('slug').value.trim().toLowerCase(),password:$('cpw').value},r=await fetch('/api/central/clubs',{method:'POST',headers:{'Content-Type':'application/json','x-central-password':pw},body:JSON.stringify(b)}),d=await r.json();if(!r.ok){alert(d.error);return}$('name').value=$('slug').value=$('cpw').value='';load()}async function setspw(id){let p=prompt("Neues Abfrage-Passwort, mindestens 8 Zeichen:");if(!p)return;let r=await fetch("/api/central/clubs/"+id+"/survey-password",{method:"PUT",headers:{"Content-Type":"application/json","x-central-password":pw},body:JSON.stringify({password:p})});if(!r.ok)alert((await r.json()).error)}async function setpw(id){let p=prompt('Neues Vereins-Passwort, mindestens 8 Zeichen:');if(!p)return;let r=await fetch('/api/central/clubs/'+id+'/password',{method:'PUT',headers:{'Content-Type':'application/json','x-central-password':pw},body:JSON.stringify({password:p})});if(!r.ok)alert((await r.json()).error)}async function toggle(id,a){await fetch('/api/central/clubs/'+id+'/active',{method:'PUT',headers:{'Content-Type':'application/json','x-central-password':pw},body:JSON.stringify({active:a})});load()}async function removeC(id,n){if(!confirm('Verein '+n+' mit allen Daten löschen?'))return;await fetch('/api/central/clubs/'+id,{method:'DELETE',headers:{'x-central-password':pw}});load()}</script></body></html>
