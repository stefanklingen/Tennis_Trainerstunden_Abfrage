<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vereinsadmin</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap wide"><section class="card"><div id="login"><h1>Vereins-Admin</h1><input id="pw" type="password" placeholder="Vereins-Admin-Passwort"><button onclick="login()">Anmelden</button><p id="lm"></p></div><div id="app" hidden><a class="back" href="/">← Startseite</a><h1 id="title"></h1><h2>Wochentag/Uhrzeit hinzufügen</h2><div class="grid"><select id="wd"><option value="1">Montag</option><option value="2">Dienstag</option><option value="3">Mittwoch</option><option value="4">Donnerstag</option><option value="5">Freitag</option><option value="6">Samstag</option><option value="7">Sonntag</option></select><input id="time" type="time"><input id="label" placeholder="Bezeichnung (optional)"><button onclick="add()">Hinzufügen</button></div><div id="slots"></div><hr><div class="toolbar"><h2>Antworten</h2><button onclick="csv()">CSV exportieren</button></div><div id="stats"></div><div class="table"><table id="tab"></table></div></div></section></main><script>const slug=location.pathname.split('/').filter(Boolean)[1],days=['','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'],$=x=>document.getElementById(x);let pw='',data;function e(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function login(){pw=$('pw').value;let r=await fetch('/api/admin/'+slug+'/results',{headers:{'x-club-password':pw}});if(!r.ok){$('lm').textContent='Falsches Passwort';return}$('login').hidden=true;$('app').hidden=false;load()}async function load(){let r=await fetch('/api/admin/'+slug+'/results',{headers:{'x-club-password':pw}});data=await r.json();render()}function render(){let a=data.slots,r=data.responses;$('title').textContent='Admin – '+data.club.name;$('slots').innerHTML=a.map(x=>`<p><b>${days[x.weekday]}</b> ${x.time.slice(0,5)} ${e(x.label||'')} <button class="danger" onclick="delS(${x.id})">Löschen</button></p>`).join('')||'Keine Zeiten.';$('stats').innerHTML=`<div class="stats"><span>${r.length} Antworten</span><span>${r.filter(x=>x.no_need).length} ohne Bedarf</span></div>`+a.map(x=>`${days[x.weekday]} ${x.time.slice(0,5)}: <b>${r.filter(y=>!y.no_need&&y.slot_ids.includes(x.id)).length}</b>`).join(' · ');$('tab').innerHTML='<tr><th>Name</th><th>Status</th>'+a.map(x=>`<th>${days[x.weekday]}<br>${x.time.slice(0,5)}</th>`).join('')+'<th></th></tr>'+r.map(x=>`<tr><td>${e(x.name)}</td><td>${x.no_need?'Kein Bedarf':'Bedarf'}</td>`+a.map(y=>`<td>${x.no_need?'–':x.slot_ids.includes(y.id)?'✓':''}</td>`).join('')+`<td><button class="danger" onclick="delR(${x.id})">Löschen</button></td></tr>`).join('')}async function add(){await fetch('/api/admin/'+slug+'/slots',{method:'POST',headers:{'Content-Type':'application/json','x-club-password':pw},body:JSON.stringify({weekday:+$('wd').value,time:$('time').value,label:$('label').value})});load()}async function delS(id){if(confirm('Zeit löschen?')){await fetch('/api/admin/'+slug+'/slots/'+id,{method:'DELETE',headers:{'x-club-password':pw}});load()}}async function delR(id){if(confirm('Antwort löschen?')){await fetch('/api/admin/'+slug+'/responses/'+id,{method:'DELETE',headers:{'x-club-password':pw}});load()}}function csv(){let a=data.slots,rows=[['Name','Kein Bedarf',...a.map(x=>days[x.weekday]+' '+x.time)],...data.responses.map(r=>[r.name,r.no_need?'Ja':'Nein',...a.map(x=>!r.no_need&&r.slot_ids.includes(x.id)?'Ja':'Nein')])],c=rows.map(x=>x.map(v=>`"${String(v).replaceAll('"','""')}"`).join(';')).join('\r\n'),u=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv'})),z=document.createElement('a');z.href=u;z.download='terminabfrage.csv';z.click();URL.revokeObjectURL(u)}</script></body></html>
