services:
  - type: web
    name: tennis-trainer-mehrvereine
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CENTRAL_ADMIN_PASSWORD
        sync: false
